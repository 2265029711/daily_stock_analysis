name: 每日股票分析

on:
  # 定时触发 - 每天北京时间 15:00 (UTC 07:00)
  schedule:
    - cron: '0 7 * * 1-5'  # 周一到周五，UTC 07:00 = 北京时间 15:00
  
  # 手动触发
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: true
        default: 'full'
        type: choice
        options:
          - full          # 完整分析（股票+大盘）
          - market-only   # 仅大盘复盘
          - stocks-only   # 仅股票分析

jobs:
  analyze:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: 创建必要目录
        run: |
          mkdir -p data logs reports
      
      - name: 执行股票分析
        env:
          # AI 分析（OpenAI 兼容 API）
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          OPENAI_REQUEST_DELAY: '3.0'  # GitHub Actions 建议增加延时
          OPENAI_MAX_RETRIES: '5'
          OPENAI_RETRY_DELAY: '5.0'
          
          # src layout: 包路径
          PYTHONPATH: src
          
          # 数据源 (可选)
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          
          # 搜索服务
          # 方式一（推荐）：一个 key 一行
          TAVILY_API_KEY_1: ${{ secrets.TAVILY_API_KEY_1 }}
          TAVILY_API_KEY_2: ${{ secrets.TAVILY_API_KEY_2 }}
          TAVILY_API_KEY_3: ${{ secrets.TAVILY_API_KEY_3 }}
          TAVILY_API_KEY_4: ${{ secrets.TAVILY_API_KEY_4 }}
          # 方式二（兼容）：逗号分隔单行
          TAVILY_API_KEYS: ${{ secrets.TAVILY_API_KEYS }}
          SERPAPI_API_KEYS: ${{ secrets.SERPAPI_API_KEYS }}
          
          # 通知（企微/Bark 二选一或同时配置）
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
          BARK_DEVICE_KEY: ${{ secrets.BARK_DEVICE_KEY }}
          BARK_SERVER_URL: ${{ secrets.BARK_SERVER_URL || 'https://api.day.app' }}
          BARK_GROUP: ${{ secrets.BARK_GROUP || '股票分析' }}
          # 多用户推送（push_config.yaml 使用 ${ENV} 占位符时，在此映射 secrets）
          # 未配置的 secret 为空字符串 → 对应占位符解析失败 → 该用户自动跳过，不影响其他用户
          BARK_KEY_USER_A: ${{ secrets.BARK_KEY_USER_A }}
          BARK_KEY_USER_B: ${{ secrets.BARK_KEY_USER_B }}
          BARK_KEY_USER_C: ${{ secrets.BARK_KEY_USER_C }}
          BARK_KEY_USER_D: ${{ secrets.BARK_KEY_USER_D }}
          
          # 自选股列表 (从 secrets 或使用默认值)
          STOCK_LIST: ${{ secrets.STOCK_LIST || '600519' }}
          
          # 按需分析：只分析用户请求的股票（配合 push_config.yaml）
          ANALYZE_REQUESTED_ONLY: ${{ secrets.ANALYZE_REQUESTED_ONLY || 'false' }}
          
          # 其他配置
          LOG_LEVEL: INFO
          MAX_WORKERS: 3
        run: |
          # 判断运行模式
          MODE="${{ github.event.inputs.mode || 'full' }}"
          
          echo "=========================================="
          echo "运行模式: $MODE"
          echo "自选股: $STOCK_LIST"
          echo "时间: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')"
          echo "=========================================="
          
          if [ "$MODE" = "market-only" ]; then
            python -m stock_analysis.main --market-review
          elif [ "$MODE" = "stocks-only" ]; then
            python -m stock_analysis.main --no-market-review
          else
            python -m stock_analysis.main
          fi
      
      - name: 上传分析报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analysis-reports-${{ github.run_number }}
          path: |
            reports/
            logs/
          retention-days: 30
      
      - name: 显示运行结果
        if: always()
        run: |
          echo "=========================================="
          echo "分析完成"
          echo "=========================================="
          if [ -d "reports" ]; then
            echo "生成的报告:"
            ls -la reports/
          fi
