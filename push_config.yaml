# ===================================
# 多用户 Bark 推送配置（正式配置，提交到仓库）
# ===================================
# ⚠️ device_key 必须使用 ${ENV} 占位符，严禁写明文 Key！
# - 本地：在 .env 中配置 BARK_KEY_USER_XXX=设备key
# - GitHub Actions：在仓库 Secrets 添加 BARK_KEY_USER_XXX，workflow 已自动映射
# 股票代码必须用引号包裹（字符串），如 '000725'

users:
  # 用户A：只收大盘复盘
  - name: 用户A-大盘
    device_key: ${BARK_KEY_USER_A}
    group: 大盘走势
    push_market: false
    stocks: []

  # 用户B：收个股 600664 哈药 + 000725 京东方 + 516350
  - name: 用户B-个股
    device_key: ${BARK_KEY_USER_B}
    group: 个股分析
    push_market: false
    stocks: ['600664', '000725', '516350']

  # 用户C：全部自选股 + 大盘
  - name: 用户C-全部
    device_key: ${BARK_KEY_USER_C}
    group: 个股分析
    push_market: false
    stocks: []
